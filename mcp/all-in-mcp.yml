name: All In Food Agent Commerce (UCP)
status: published
status_raw: hosted
transport: mcp
platform: shopify
description: All In Food's Shopify storefront implements the Universal Commerce Protocol (UCP) for agent-driven
  commerce and exposes a live, hosted MCP endpoint. Agents discover capabilities at /.well-known/ucp,
  then drive catalog search, cart, checkout, and fulfillment over MCP. Checkout requires contemporaneous
  human buyer approval on every payment.
endpoints:
  mcp: https://allinfood.com/api/ucp/mcp
  mcp_canonical: https://all-in-food.myshopify.com/api/ucp/mcp
  discovery: https://allinfood.com/.well-known/ucp
ucp_versions:
- '2026-04-08'
- '2026-01-23'
spec: https://ucp.dev/2026-04-08/specification/overview/
schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
tools:
- name: search_catalog
  source: documented
  description: Find products matching the buyer's intent.
- name: create_cart
  source: documented
  description: Create a cart and add desired items.
- name: create_checkout
  source: documented
  description: Start the purchase flow.
- name: update_checkout
  source: documented
  description: Set shipping address and method.
- name: complete_checkout
  source: documented
  description: Finalize the purchase — buyer must explicitly approve payment.
payment_handlers:
