name: All In
description: >-
  All In Food makes organic, gluten-free nut & seed snack bars on a social-impact
  model — every bar purchased helps fund local nutritious-food-access initiatives
  such as food banks, community gardens, and meal programs across the U.S. The
  company is backed by Obvious Ventures (a reported $4M raise) and sells through
  Sprouts and Starbucks as well as its own online store. While All In is a
  consumer-packaged-goods brand rather than a developer platform, its Shopify
  storefront exposes a genuine agent-native commerce surface: a canonical
  agents.md document, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a live hosted MCP endpoint at /api/ucp/mcp for agent-driven
  catalog search, cart, checkout and fulfillment, and Shopify Customer Account
  OpenID Connect for buyer identity. Checkout always requires explicit human
  buyer approval on payment.
